apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configmap
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-configmap
    app.kubernetes.io/version: "{{ .Values.version }}"
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: simple-backend
    app.kubernetes.io/managed-by: helm
data:
  10-create-user-and-dbs.sql: |
    {{- range $user := .Values.users }}
    CREATE USER {{ $user.name }} WITH PASSWORD '{{ $user.password }}';
    {{- end }}

    {{- range $database := .Values.datases }}
    CREATE DATABASE {{ $database.name }};
    GRANT ALL PRIVILEGES ON DATABASE {{ $database.name }} TO {{ $database.user }};
    {{- end }}
    
    \c users;
    CREATE TABLE users
    (
        id            SERIAL PRIMARY KEY,
        username      VARCHAR(80) NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        name          VARCHAR(80) NOT NULL,
        surname       VARCHAR(80) NOT NULL,
        fathername    VARCHAR(80) NOT NULL,
        phone         VARCHAR(80) NOT NULL,
        email         VARCHAR(80) NOT NULL,
        role          VARCHAR(20) NOT NULL
            CHECK (role IN ('ADMIN', 'USER'))
    );

    INSERT INTO public.users(id, username, password_hash, name, surname, fathername, phone, email, role) VALUES 
    (1, 'admin', 'admin', 'Админ', 'Админ', 'Админ', '88005553535', 'admin@mail.ru', 'ADMIN');

    \c tickets;
    CREATE TABLE ticket
    (
        id            SERIAL PRIMARY KEY,
        ticket_uid    uuid UNIQUE NOT NULL,
        username      VARCHAR(80) NOT NULL,
        flight_number VARCHAR(20) NOT NULL,
        price         INT         NOT NULL,
        status        VARCHAR(20) NOT NULL
            CHECK (status IN ('PAID', 'CANCELED'))
    );

    \c flights;
    CREATE TABLE airport
    (
        id      SERIAL PRIMARY KEY,
        name    VARCHAR(255),
        city    VARCHAR(255),
        country VARCHAR(255)
    );

    CREATE TABLE flight
    (
        id              SERIAL PRIMARY KEY,
        flight_number   VARCHAR(20)              NOT NULL,
        datetime        TIMESTAMP WITH TIME ZONE NOT NULL,
        from_airport_id INT REFERENCES airport (id),
        to_airport_id   INT REFERENCES airport (id),
        price           INT                      NOT NULL
    );

    INSERT INTO public.airport(id, name, city, country) VALUES 
    (1, 'Шереметьево', 'Москва', 'Россия'),
    (2, 'Пулково', 'Санкт-Петербург', 'Россия'),
    (3, 'Внуково', 'Москва', 'Россия'),
    (4, 'Домодедово', 'Москва', 'Россия');

    INSERT INTO public.flight(
      id, flight_number, datetime, from_airport_id, to_airport_id, price) VALUES
    (1, 'AFL031', '2021-10-08 20:00', 2, 1, 1500),
    (2, 'AFL032', '2021-10-08 21:00', 2, 4, 1000),
    (3, 'AFL033', '2021-10-10 10:00', 3, 2, 800),
    (4, 'AFL034', '2021-10-11 11:15', 4, 2, 2500),
    (5, 'AFL035', '2021-11-08 20:00', 2, 3, 1500),
    (6, 'AFL036', '2021-11-09 19:00', 1, 2, 1200),
    (7, 'AFL037', '2021-11-20 08:00', 2, 3, 1600),
    (8, 'AFL038', '2021-11-29 17:00', 2, 4, 1700);
    

    \c privileges;
    CREATE TABLE privilege
    (
        id       SERIAL PRIMARY KEY,
        username VARCHAR(80) NOT NULL UNIQUE,
        status   VARCHAR(80) NOT NULL DEFAULT 'BRONZE'
            CHECK (status IN ('BRONZE', 'SILVER', 'GOLD')),
        balance  INT
    );

    CREATE TABLE privilege_history
    (
        id             SERIAL PRIMARY KEY,
        privilege_id   INT REFERENCES privilege (id),
        ticket_uid     uuid        NOT NULL,
        datetime       TIMESTAMP   NOT NULL,
        balance_diff   INT         NOT NULL,
        operation_type VARCHAR(20) NOT NULL
            CHECK (operation_type IN ('FILL_IN_BALANCE', 'DEBIT_THE_ACCOUNT'))
    );

    \c stats;
    CREATE TABLE stats
    (
        id             SERIAL PRIMARY KEY,
        method         VARCHAR(80) NOT NULL,
        path           VARCHAR(80) NOT NULL,
        status_code    INT NOT NULL,
        duration_ms    BIGINT NOT NULL,
        timestamp      TIMESTAMP WITH TIME ZONE NOT NULL
    );