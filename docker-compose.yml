version: "3"
services:
  kafka:
    image: apache/kafka-native
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: CONTROLLER://localhost:9093,DOCKER://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: library/postgres:13
    container_name: postgres-service
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5433:5432"

  nginx:
    image: dmitriyyas/mytickets_frontend:latest
    container_name: nginx
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8010:8010"


  stats_service:
    image: dmitriyyas/stats_service:latest
    container_name: services-stats-srv
    build:
      context: src
      dockerfile: StatsService/Dockerfile
    depends_on:
      - postgres
      - kafka
    ports:
      - "8040:8040"

  bonus_service:
    image: dmitriyyas/bonus_service:latest
    container_name: services-bonus-srv
    build:
      context: src
      dockerfile: BonusService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8050:8050"
  
  flight_service:
    image: dmitriyyas/flight_service:latest
    container_name: services-flight-srv
    build:
      context: src
      dockerfile: FlightService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8060:8060"
  
  ticket_service:
    image: dmitriyyas/ticket_service:latest
    container_name: services-ticket-srv
    build:
      context: src
      dockerfile: TicketService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8070:8070"
  
  gateway_service:
    image: dmitriyyas/gateway_service:latest
    container_name: services-gateway-srv
    build:
      context: src
      dockerfile: GatewayService/Dockerfile
    depends_on:
      - postgres
      - kafka
    ports:
      - "8080:8080"

  auth_service:
    image: dmitriyyas/auth_service:latest
    container_name: services-auth-srv
    build:
      context: src
      dockerfile: AuthService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8090:8090"

volumes:
  db-data:
  kafka-data:
  