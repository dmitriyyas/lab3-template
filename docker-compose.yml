version: "3"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5433:5432"

  stats_service:
    container_name: stats_service
    build:
      context: src
      dockerfile: StatsService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8040:8040"

  bonus_service:
    container_name: bonus_service
    build:
      context: src
      dockerfile: BonusService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8050:8050"
  
  flight_service:
    container_name: flight_service
    build:
      context: src
      dockerfile: FlightService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8060:8060"
  
  ticket_service:
    container_name: ticket_service
    build:
      context: src
      dockerfile: TicketService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8070:8070"
  
  gateway_service:
    container_name: gateway_service
    build:
      context: src
      dockerfile: GatewayService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  auth_service:
    container_name: auth_service
    build:
      context: src
      dockerfile: AuthService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8090:8090"

volumes:
  db-data:
  